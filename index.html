<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理財計畫</title>
    <!-- iPhone 圖示 -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios/180/8b5a42/wallet.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="理財計畫">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { milktea: { 50: '#fdf8f5', 100: '#f8efe6', 200: '#eddcd0', 300: '#dcb8a3', 800: '#8b5a42', 900: '#734833' }}}} }
    </script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        ::-webkit-scrollbar { display: none; }
        .progress-bar-fill { transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        body.modal-open { overflow: hidden; }
    </style>
</head>
<body class="bg-milktea-100 text-milktea-900 font-sans min-h-screen p-4 sm:p-8 pb-32">

    <nav class="glass-card sticky top-0 z-40 max-w-2xl mx-auto rounded-2xl p-4 mb-6 shadow-sm flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-milktea-800">Finance Dashboard</h1>
        <div id="status-indicator" class="text-sm font-medium text-gray-500 animate-pulse">資料同步中...</div>
    </nav>

    <main class="max-w-2xl mx-auto space-y-8">
        <!-- 1. 現金與目標 -->
        <section>
            <div class="glass-card rounded-3xl p-6 shadow-sm">
                <h2 class="text-sm font-semibold text-gray-500 mb-1">實際可動用現金 (扣除卡費與房貸)</h2>
                <div class="text-4xl font-extrabold text-milktea-900 tracking-tight" id="available-cash">讀取中...</div>
                
                <div class="mt-4 flex gap-6 text-sm">
                    <div><span class="text-gray-400">銀行總額 </span><span class="font-bold text-gray-700" id="total-cash">...</span></div>
                    <div><span class="text-gray-400">未出帳卡費 </span><span class="font-bold text-red-400" id="total-credit">...</span></div>
                </div>

                <!-- 🌟 智能繳卡費按鈕 -->
                <button onclick="payCreditCards()" class="mt-5 w-full bg-white/50 hover:bg-white/80 border border-red-200 text-red-500 font-bold py-2.5 rounded-xl transition-colors shadow-sm flex justify-center items-center gap-2 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" /></svg>
                    執行本月智能繳卡費
                </button>

                <div class="mt-5 pt-5 border-t border-white/50">
                    <div class="flex justify-between text-sm mb-2">
                        <span class="text-gray-500 font-semibold text-xs">本月五年計畫達標率</span>
                        <span class="text-milktea-900 font-bold" id="cash-progress-text">...%</span>
                    </div>
                    <div class="w-full bg-white/60 rounded-full h-3 mb-1.5 overflow-hidden shadow-inner">
                        <div id="cash-progress-bar" class="progress-bar-fill bg-green-400 h-3 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. 親友借款進度 -->
        <section>
            <div class="flex justify-between items-end mb-3 pl-2">
                <h3 class="text-lg font-bold text-milktea-800">親友借款進度</h3>
                <span class="text-sm font-bold text-red-400" id="total-remaining-debt">剩餘待還: ...</span>
            </div>
            <div class="glass-card rounded-3xl p-6 shadow-sm space-y-5" id="debts-container"></div>
        </section>

        <!-- 3. 股票投資部位 -->
        <section>
            <h3 class="text-lg font-bold text-milktea-800 mb-3 pl-2">股票資產部位</h3>
            <div class="glass-card rounded-3xl p-6 shadow-sm">
                <div class="flex justify-between items-end mb-6 border-b border-gray-200/50 pb-4">
                    <div><h2 class="text-sm font-semibold text-gray-500 mb-1">總現值</h2><div class="text-3xl font-extrabold text-milktea-900" id="total-stock-value">讀取中...</div></div>
                    <div class="text-right"><h2 class="text-sm font-semibold text-gray-500 mb-1">未實現損益</h2><div class="text-xl font-bold" id="total-stock-pl">...</div></div>
                </div>
                <div id="stocks-container" class="space-y-2"></div>
            </div>
        </section>

        <!-- 4. 帳戶明細 -->
        <section>
            <h3 class="text-lg font-bold text-milktea-800 mb-3 pl-2">各帳戶餘額明細</h3>
            <div id="accounts-container" class="grid grid-cols-2 gap-4"></div>
        </section>
    </main>

    <!-- 浮動更新按鈕 -->
    <button onclick="openUpdateModal()" class="fixed bottom-8 right-8 bg-milktea-800 hover:bg-milktea-900 text-white shadow-xl shadow-milktea-800/30 rounded-full py-4 px-6 font-bold flex items-center gap-2 transition-transform active:scale-95 z-40">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
        全面更新
    </button>

    <!-- 更新視窗 -->
    <div id="update-modal" class="hidden fixed inset-0 bg-milktea-900/40 backdrop-blur-md z-50 flex flex-col justify-end sm:justify-center items-center">
        <div class="bg-milktea-50 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 sm:p-8 max-h-[90vh] flex flex-col shadow-2xl">
            <h2 class="text-xl font-bold text-milktea-900 mb-2">更新財務紀錄</h2>
            <form id="update-form" onsubmit="submitUpdates(event)" class="overflow-y-auto pr-2 pb-4 space-y-6 flex-1 mt-4"></form>
            <div class="flex gap-3 pt-4 border-t border-gray-200 mt-2">
                <button type="button" onclick="closeUpdateModal()" class="flex-1 py-3 rounded-xl bg-gray-200 text-gray-700 font-bold">取消</button>
                <button type="submit" form="update-form" id="submit-btn" class="flex-1 py-3 rounded-xl bg-milktea-800 text-white font-bold"><span id="submit-text">儲存同步</span></button>
            </div>
        </div>
    </div>

    <script>
        // 🚨 務必填入您的 API URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbxlY_IDwSol113nFFddGTZ-3ILMgk2CKsgnRFskw1JWisbPN0ODg9AG_Hy_bPTuYyJUwg/exec';
        
        let globalData = {}; 
        const formatMoney = (num) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(num);

        async function fetchFinancialData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (data.status === "success") {
                    globalData = data; 
                    
                    const availableCash = data.cashData.availableCash;
                    const targetCash = data.targetData.currentTarget;

                    document.getElementById('available-cash').innerText = formatMoney(availableCash);
                    document.getElementById('total-cash').innerText = formatMoney(data.cashData.totalCash);
                    document.getElementById('total-credit').innerText = formatMoney(data.cashData.totalCreditCardDebt);
                    
                    const cashProgress = Math.min((availableCash / targetCash) * 100, 100).toFixed(1);
                    document.getElementById('cash-progress-text').innerText = `${cashProgress}%`;
                    setTimeout(() => { document.getElementById('cash-progress-bar').style.width = `${cashProgress}%`; }, 100);

                    if (data.debtData) {
                        document.getElementById('total-remaining-debt').innerText = `剩餘總額: ${formatMoney(data.debtData.totalRemaining)}`;
                        const debtsContainer = document.getElementById('debts-container');
                        debtsContainer.innerHTML = '';
                        data.debtData.debts.forEach(debt => {
                            if (debt.remaining > 0) { 
                                const debtUI = document.createElement('div');
                                debtUI.innerHTML = `
                                    <div class="flex justify-between items-end mb-1.5">
                                        <span class="text-gray-700 font-bold">${debt.name}</span>
                                        <span class="text-xs text-gray-500">已還 ${debt.progress}% / 剩 ${formatMoney(debt.remaining)}</span>
                                    </div>
                                    <div class="w-full bg-white/60 rounded-full h-2.5 overflow-hidden">
                                        <div class="progress-bar-fill bg-milktea-800 h-2.5 rounded-full" style="width: 0%"></div>
                                    </div>
                                `;
                                debtsContainer.appendChild(debtUI);
                                setTimeout(() => debtUI.querySelector('.progress-bar-fill').style.width = `${debt.progress}%`, 200);
                            }
                        });
                    }

                    document.getElementById('total-stock-value').innerText = formatMoney(data.stockData.totalMarketValue);
                    const plElement = document.getElementById('total-stock-pl');
                    const isPlPositive = data.stockData.totalPL >= 0;
                    plElement.innerText = (isPlPositive ? '+' : '') + formatMoney(data.stockData.totalPL);
                    plElement.className = isPlPositive ? "text-xl font-bold text-red-500" : "text-xl font-bold text-green-500";
                    
                    const stockContainer = document.getElementById('stocks-container');
                    stockContainer.innerHTML = '';
                    data.stockData.holdings.forEach(stock => {
                        const isPositive = stock.profitLoss >= 0;
                        stockContainer.innerHTML += `
                            <div class="flex justify-between items-center p-3 hover:bg-white/40 rounded-xl">
                                <div><div class="font-bold text-milktea-900">${stock.name}</div><div class="text-xs text-gray-500 mt-0.5">${stock.shares} 股</div></div>
                                <div class="text-right"><div class="font-bold text-gray-800">${formatMoney(stock.marketValue)}</div>
                                <div class="text-sm ${isPositive ? 'text-red-500' : 'text-green-500'} font-medium">${isPositive ? '+' : ''}${formatMoney(stock.profitLoss)}</div></div>
                            </div>
                        `;
                    });

                    const accContainer = document.getElementById('accounts-container');
                    accContainer.innerHTML = ''; 
                    data.cashData.accounts.forEach(acc => {
                        accContainer.innerHTML += `
                            <div class="glass-card rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                                <span class="text-sm text-gray-500 font-medium">${acc.name}</span>
                                <span class="text-lg font-bold text-milktea-900 mt-1">${formatMoney(acc.balance)}</span>
                            </div>
                        `;
                    });

                    const status = document.getElementById('status-indicator');
                    status.innerText = "已同步";
                    status.classList.replace('text-gray-500', 'text-green-600');
                    status.classList.remove('animate-pulse');
                }
            } catch (error) {
                document.getElementById('status-indicator').innerText = "連線失敗";
            }
        }

        // 🌟 執行一鍵智能繳款邏輯
        async function payCreditCards() {
            if (!confirm("確定要執行智能繳款嗎？\n系統將自動從各銀行扣除卡費，若餘額不足將自動由「玉山-台幣」代墊，並將卡費歸零。")) return;
            
            document.getElementById('status-indicator').innerText = "扣款執行中...";
            document.getElementById('status-indicator').classList.add('animate-pulse', 'text-gray-500');

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'pay_credit_cards' })
                });
                await fetchFinancialData(); // 重整畫面
                alert("✅ 卡費扣款成功！");
            } catch (error) {
                alert("執行失敗，請檢查網路連線。");
            }
        }

        function openUpdateModal() {
            const form = document.getElementById('update-form');
            let html = '';
            
            html += '<div class="space-y-2"><h3 class="font-bold text-milktea-800 sticky top-0 bg-milktea-50 py-1 z-10">🏦 銀行餘額</h3>';
            globalData.cashData.accounts.forEach(acc => {
                html += `<div class="flex items-center justify-between bg-white/50 p-2 rounded-xl">
                            <label class="text-sm font-bold text-gray-700 w-1/3 truncate">${acc.name}</label>
                            <input type="number" name="acc_${acc.name}" value="${acc.balance}" class="w-2/3 bg-white rounded-lg py-1 px-2 text-right">
                         </div>`;
            });
            html += '</div>';

            // 🌟 取消過濾，列出「所有銀行」的信用卡輸入框
            html += '<div class="space-y-2 mt-6"><h3 class="font-bold text-milktea-800 sticky top-0 bg-milktea-50 py-1 z-10">💳 信用卡未出帳</h3>';
            globalData.cashData.accounts.forEach(acc => {
                html += `<div class="flex items-center justify-between bg-white/50 p-2 rounded-xl">
                            <label class="text-sm font-bold text-gray-700 w-1/3 truncate">${acc.name}</label>
                            <input type="number" name="cc_${acc.name}" value="${acc.ccBill}" class="w-2/3 bg-white rounded-lg py-1 px-2 text-right text-red-500">
                         </div>`;
            });
            html += '</div>';

            if (globalData.debtData && globalData.debtData.debts.length > 0) {
                html += '<div class="space-y-2 mt-6"><h3 class="font-bold text-milktea-800 sticky top-0 bg-milktea-50 py-1 z-10">🤝 親友借款 (已還金額)</h3>';
                globalData.debtData.debts.forEach(debt => {
                    html += `<div class="flex items-center justify-between bg-white/50 p-2 rounded-xl">
                                <label class="text-sm font-bold text-gray-700 w-1/3 truncate">${debt.name}</label>
                                <input type="number" name="debt_${debt.rawName}" value="${debt.rawRepaid}" class="w-2/3 bg-white rounded-lg py-1 px-2 text-right text-milktea-900">
                             </div>`;
                });
                html += '</div>';
            }

            if (globalData.stockData && globalData.stockData.holdings.length > 0) {
                html += '<div class="space-y-2 mt-6"><h3 class="font-bold text-milktea-800 sticky top-0 bg-milktea-50 py-1 z-10">📈 股票持股數</h3>';
                globalData.stockData.holdings.forEach(stock => {
                    html += `<div class="flex items-center justify-between bg-white/50 p-2 rounded-xl">
                                <label class="text-sm font-bold text-gray-700 w-1/3 truncate">${stock.name}</label>
                                <input type="number" name="stock_${stock.name}" value="${stock.shares}" class="w-2/3 bg-white rounded-lg py-1 px-2 text-right">
                             </div>`;
                });
                html += '</div>';
            }

            form.innerHTML = html;
            document.getElementById('update-modal').classList.remove('hidden');
            document.body.classList.add('modal-open');
        }

        function closeUpdateModal() {
            document.getElementById('update-modal').classList.add('hidden');
            document.body.classList.remove('modal-open');
        }

        async function submitUpdates(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            const text = document.getElementById('submit-text');
            btn.disabled = true;
            text.innerText = "儲存中...";

            const formData = new FormData(event.target);
            const updates = { accounts: {}, creditCards: {}, debts: {}, stocks: {} };
            
            for (let [key, value] of formData.entries()) {
                const val = Number(value);
                if (key.startsWith('acc_')) updates.accounts[key.replace('acc_', '')] = val;
                else if (key.startsWith('cc_')) updates.creditCards[key.replace('cc_', '')] = val;
                else if (key.startsWith('debt_')) updates.debts[key.replace('debt_', '')] = val;
                else if (key.startsWith('stock_')) updates.stocks[key.replace('stock_', '')] = val;
            }

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'update_all', data: updates })
                });

                closeUpdateModal();
                document.getElementById('status-indicator').innerText = "更新資料中...";
                document.getElementById('status-indicator').classList.add('animate-pulse', 'text-gray-500');
                
                await fetchFinancialData(); 
            } catch (error) {
                alert("儲存失敗，請確認 Apps Script 已發布為新版本！");
            } finally {
                btn.disabled = false;
                text.innerText = "儲存同步";
            }
        }

        window.onload = fetchFinancialData;
    </script>
</body>
</html>
