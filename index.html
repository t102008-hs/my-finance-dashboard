<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>理財計畫</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5a42' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 12V7H5a2 2 0 0 1 0-4h14v4'/%3E%3Cpath d='M3 5v14a2 2 0 0 0 2 2h16v-5'/%3E%3Cpath d='M18 12a2 2 0 0 0 0 4h4v-4Z'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8b5a42" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17110e" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="理財計畫">
<link rel="stylesheet" href="/style.css">
</head>
<body class="bg-milktea-100 text-milktea-900 font-sans min-h-screen p-4 sm:p-8" style="padding-bottom:calc(10rem + env(safe-area-inset-bottom))">

<nav class="glass sticky top-0 z-40 max-w-2xl mx-auto rounded-2xl p-4 mb-6 shadow-sm flex justify-between items-center">
  <div><h1 class="text-xl font-bold tracking-wider text-milktea-800">Finance Dashboard</h1>
  <div id="status" class="text-xs text-gray-500">載入中…</div></div>
  
</nav>

<main id="app" class="max-w-2xl mx-auto space-y-8">
  <div class="glass rounded-3xl p-6 space-y-3 animate-pulse"><div class="h-4 w-40 bg-milktea-200 rounded"></div><div class="h-10 w-56 bg-milktea-200 rounded"></div><div class="h-3 bg-milktea-200 rounded"></div></div>
  <div class="glass rounded-3xl p-6 h-40 animate-pulse"></div>
</main>

<button id="fab" onclick="fabGo()" aria-label="更新" class="liquid fixed right-5 w-14 h-14 rounded-full flex items-center justify-center text-milktea-800 active:scale-95 transition-transform z-40" style="bottom:calc(5.25rem + env(safe-area-inset-bottom))"></button>

<div id="modal" class="hidden fixed inset-0 bg-milktea-900/40 backdrop-blur-md z-50 flex flex-col justify-end sm:justify-center items-center">
  <div class="bg-milktea-50 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 max-h-[92vh] flex flex-col shadow-2xl" style="padding-bottom:calc(1.5rem + env(safe-area-inset-bottom))">
    <h2 class="text-xl font-bold">更新財務紀錄</h2>
    <form id="form" onsubmit="save(event)" class="overflow-y-auto space-y-3 flex-1 mt-3 pb-3"></form>
    <div id="preview" class="text-sm font-bold text-center py-2 border-t border-gray-200"></div>
    <div class="flex gap-3">
      <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-200 font-bold">取消</button>
      <button type="submit" form="form" id="sbtn" class="flex-1 py-3 rounded-xl bg-milktea-800 text-white font-bold">儲存同步</button>
    </div>
  </div>
</div>
<nav id="tabbar" class="liquid fixed inset-x-4 mx-auto max-w-sm z-40 flex gap-1 p-1.5 rounded-full" style="bottom:calc(.75rem + env(safe-area-inset-bottom))"></nav>
<div id="tmodal" class="hidden fixed inset-0 bg-milktea-900/40 backdrop-blur-md z-50 flex flex-col justify-end sm:justify-center items-center"><div class="bg-milktea-50 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 max-h-[92vh] flex flex-col shadow-2xl" style="padding-bottom:calc(1.5rem + env(safe-area-inset-bottom))">
  <h2 class="text-xl font-bold">記一筆交易</h2><div id="tform" class="overflow-y-auto space-y-3 flex-1 mt-3 pb-3"></div><div id="tprev" class="text-sm font-bold text-center py-2 border-t border-gray-200 min-h-[2.5rem]"></div>
  <div class="flex gap-3"><button type="button" onclick="closeTrade()" class="flex-1 py-3 rounded-xl bg-gray-200 font-bold">取消</button><button id="tbtn" onclick="saveTrade()" class="flex-1 py-3 rounded-xl bg-milktea-800 text-white font-bold">儲存</button></div></div></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 top-4 z-[60] hidden bg-milktea-900 text-white text-sm px-4 py-2 rounded-full shadow-lg"></div>

<script>
// 資料由 /api/data（Vercel）代理讀寫，網頁內不含 Apps Script 網址與密鑰
const API_URL = '/api/data';
const VER = '2026.11.2';

const $ = id => document.getElementById(id);
const fm = n => new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n);
let D = null;
const M = fm;
const tok = () => localStorage.getItem('tok') || '';
const hhmm = ts => new Date(ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.remove('hidden'); setTimeout(()=>el.classList.add('hidden'),2500); }
function setStatus(t,cls='text-gray-500'){ const s=$('status'); s.textContent=t; s.className='text-xs '+cls; }

// 先秀快取、背景更新（stale-while-revalidate）
async function load(retry=0){
  if(!D){ try{ const c=JSON.parse(localStorage.getItem('cache')||'null'); if(c){ D=c.d; render(); setStatus('快取 '+hhmm(c.t)+'・更新中…'); } }catch(e){} }
  if(!tok()){ const t=prompt('請輸入存取密碼'); if(!t){ setStatus('未輸入密碼','text-amber-700'); return; } localStorage.setItem('tok',t); }
  try{
    const r = await fetch(API_URL,{headers:{'x-pass':tok()}});
    const j = await r.json();
    if(j.message==='unauthorized'){ localStorage.removeItem('tok'); toast('密碼錯誤'); return load(); }
    if(j.status!=='success') throw new Error(j.message||'error');
    D=j; localStorage.setItem('cache',JSON.stringify({t:Date.now(),d:j}));
    render(); setStatus('已同步 '+hhmm(Date.now()),'text-green-600');
  }catch(e){
    if(retry<2){ setStatus(`喚醒伺服器中 (${retry+1}/2)…`); setTimeout(()=>load(retry+1),1500); }
    else setStatus(D?'離線：顯示上次資料':'連線失敗','text-amber-700');
  }
}

function chart(s, nowAvail){
  if(s.length<2) return '';
  const W=320,H=110,P=8, vs=s.flatMap(x=>[x.target,x.actual]).filter(v=>v!=null);
  const lo=Math.min(...vs), hi=Math.max(...vs);
  const X=i=>P+i*(W-2*P)/(s.length-1), Y=v=>H-P-(v-lo)/(hi-lo||1)*(H-2*P);
  const path=k=>{let d='',m=false; s.forEach((x,i)=>{ if(x[k]==null){m=false;return;} d+=(m?'L':'M')+X(i).toFixed(1)+' '+Y(x[k]).toFixed(1); m=true; }); return d;};
  const n=new Date(), ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'), ni=s.findIndex(x=>x.m===ym);
  const dot = ni>=0 ? `<line x1="${X(ni)}" x2="${X(ni)}" y1="${P}" y2="${H-P}" stroke="#dcb8a3" stroke-dasharray="2 3"/><circle cx="${X(ni)}" cy="${Y(Math.max(lo,Math.min(hi,nowAvail)))}" r="4" fill="#8b5a42"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full"><path d="${path('target')}" fill="none" stroke="#dcb8a3" stroke-width="2" stroke-dasharray="4 3"/><path d="${path('actual')}" fill="none" stroke="#8b5a42" stroke-width="2.5"/>${dot}</svg>
  <div class="flex justify-between text-xs text-gray-500 mt-1"><span>${s[0].m}</span><span><span class="text-milktea-300">╌╌</span> 計畫　<span class="text-milktea-800">━━</span> 實際　● 現在</span><span>${s[s.length-1].m}</span></div>`;
}

let CM='line',CR='win';
function setChart(m,r){ if(m)CM=m; if(r)CR=r; drawChart(); }
function drawChart(){
  const box=$('chartbox'); if(!box) return;
  const all=D.targetData.series, n=new Date(), ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'), ni=all.findIndex(x=>x.m===ym);
  let a=0,b=all.length;
  if(ni>=0){ if(CR==='win'){a=Math.max(0,ni-3);b=Math.min(all.length,ni+10);} if(CR==='12'){a=Math.max(0,ni-11);b=ni+1;} }
  const s=all.slice(a,b), btn=(t,on,f)=>`<button onclick="${f}" class="px-3 py-1 rounded-full text-xs font-bold ${on?'bg-milktea-800 text-white':'bg-white/60'}">${t}</button>`;
  $('chartbar').innerHTML=btn('近期',CR==='win',"setChart(0,'win')")+btn('近12個月',CR==='12',"setChart(0,'12')")+btn('全部',CR==='all',"setChart(0,'all')")+'<span class="flex-1"></span>'+btn('折線',CM==='line',"setChart('line')")+btn('差距',CM==='bar',"setChart('bar')");
  box.innerHTML=CM==='line'?chart(s,D.cashData.availableCash):bars(s,ym);
}
function bars(s,ym){
  const v=s.map(x=>{const a=x.m===ym?D.cashData.availableCash:x.actual; return {m:x.m,d:a==null?null:a-x.target};}).filter(x=>x.d!=null);
  if(!v.length) return '<div class="text-sm text-gray-500 text-center py-6">這個範圍內還沒有實際資料</div>';
  const W=320,H=130,P=10,mx=Math.max(...v.map(x=>Math.abs(x.d)),1),bw=Math.min(28,(W-2*P)/v.length-4),mid=H/2-6;
  const r=v.map((x,i)=>{const h=Math.abs(x.d)/mx*(mid-P),cx=P+(i+.5)*(W-2*P)/v.length,y=x.d>=0?mid-h:mid;
    return `<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(h,1).toFixed(1)}" rx="3" fill="${x.d>=0?'#5fae7c':'#e0a43a'}"/>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full"><line x1="${P}" x2="${W-P}" y1="${mid}" y2="${mid}" stroke="#dcb8a3"/>${r}</svg><div class="flex justify-between text-xs text-gray-500 mt-1"><span>${v[0].m}</span><span>實際 − 月底目標（綠＝超前　黃＝落後）</span><span>${v[v.length-1].m}</span></div>`;
}
function flowCard(){
  const c=D.cashData,cf=D.config||{},n=new Date(),td=n.getDate(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),cl=d=>Math.min(d,dim),ev=[];
  if(c.mortgagePending) ev.push({d:cl(cf.mortgageDay||3),t:'🏠 房貸扣款',a:c.mortgage,note:'已從可動用現金預扣'});
  c.accounts.forEach(a=>{ if(a.ccDay&&a.ccBill>0&&cl(a.ccDay)>=td) ev.push({d:cl(a.ccDay),t:'💳 '+a.name+' 卡費',a:a.ccBill,note:'自動扣款，不影響可動用現金'}); });
  if(!ev.length) return '';
  ev.sort((x,y)=>x.d-y.d);
  return `<section><h3 class="text-lg font-bold text-milktea-800 mb-3 pl-2">本月即將發生</h3><div class="glass rounded-3xl p-5 shadow-sm space-y-3">`+ev.map(e=>`<div class="flex justify-between items-center text-sm"><span><b class="mr-2">${n.getMonth()+1}/${e.d}</b>${e.t}${e.d<td?'（已到期，待更新餘額）':''}</span><span class="text-right"><b class="text-amber-700">${fm(e.a)}</b><div class="text-xs text-gray-400">${e.note}</div></span></div>`).join('')+'</div></section>';
}
const TAB={'計畫 vs 實際':'plan','情境模擬':'plan','長期里程碑':'plan','淨資產走勢':'ov','本月即將發生':'ov','親友借款進度':'fund','各帳戶餘額明細':'fund','股票存摺':'stk'};
const TABS=[['ov','總覽','<path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>'],['fund','資金','<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-3v3"/><circle cx="16.5" cy="13.5" r="1.2"/>'],['stk','股票','<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>'],['plan','規劃','<path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/>']];
let TB=localStorage.getItem('tab')||'ov', SV='inv', SA=false, TR='buy';
function route(){ [...$('app').children].forEach(el=>{ const t=(el.querySelector('h3')||{}).textContent||''; let k='ov'; for(const key in TAB) if(t.indexOf(key)===0) k=TAB[key]; el.dataset.tab=k; }); showTab(TB,1); }
function showTab(t,keep){ TB=t; localStorage.setItem('tab',t); [...$('app').children].forEach(el=>{ if(el.dataset.tab) el.classList.toggle('hidden',el.dataset.tab!==t); }); renderBar(); if(!keep) window.scrollTo(0,0); }
function renderBar(){
  $('tabbar').innerHTML=TABS.map(t=>`<button onclick="showTab('${t[0]}')" class="flex-1 flex flex-col items-center py-1.5 rounded-full text-[11px] font-bold ${TB===t[0]?'tab-on text-milktea-800':'text-gray-500'}"><svg class="w-6 h-6 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t[2]}</svg>${t[1]}</button>`).join('');
  const f=$('fab'); if(f) f.innerHTML=`<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${TB==='stk'?'<path d="M12 5v14M5 12h14"/>':'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'}</svg>`;
}
function closeTrade(){ $('tmodal').classList.add('hidden'); document.body.classList.remove('mo'); }
function fabGo(){ if(!D) return; TB==='stk'?openTrade('buy'):openModal(); }
function accHTML(c){
  const all=c.accounts.slice().sort((a,b)=>b.balance-a.balance), vis=all.filter(a=>SA||a.balance>0||a.ccBill>0), hid=all.length-vis.length;
  return vis.map(a=>`<div class="flex justify-between items-center py-2.5"><div><b class="text-sm">${a.name}</b>${a.ccBill>0?`<div class="text-xs text-amber-700">卡費 ${M(a.ccBill)}${a.ccDay?'・'+a.ccDay+' 日自動扣':''}</div>`:''}</div><b>${M(a.balance)}</b></div>`).join('<div class="border-t border-gray-200/60"></div>')
   +(hid||SA?`<button onclick="SA=!SA;render()" class="w-full text-xs text-gray-500 pt-3">${SA?'收合 $0 帳戶':'顯示其他 '+hid+' 個 $0 帳戶'}</button>`:'');
}
const taxRate=tk=>{tk=String(tk); return /^00\d+B$/.test(tk)?0:tk.startsWith('00')?0.001:0.003;};   // 債券ETF證交稅目前免徵（請留意法規期限）
function drawStock(){
  const box=$('stkbox'); if(!box) return;
  const st=D.stockData, tr=(D.trades||[]).slice().reverse(), lg=D.soldLegacy||[], sells=tr.filter(x=>x.act==='賣');
  const real=sells.reduce((a,x)=>a+x.pl,0)+lg.reduce((a,x)=>a+x.pl,0), un=st.totalPL||0, dv=tr.filter(x=>x.act==='息').reduce((a,x)=>a+x.pl,0);
  const pl=v=>`<span class="${v>=0?'text-red-500':'text-green-600'}">${v>=0?'+':'−'}${fm(Math.abs(v))}</span>`;
  const pill=(k,t)=>`<button onclick="SV='${k}';drawStock()" class="px-3 py-1 rounded-full text-xs font-bold ${SV===k?'bg-milktea-800 text-white':'bg-white/60'}">${t}</button>`;
  const row=(l,sub,r,r2,click='')=>`<div ${click} class="flex justify-between items-center p-3 rounded-xl ${click?'active:bg-white/40':''}"><div><b>${l}</b><div class="text-xs text-gray-500">${sub}</div></div><div class="text-right"><b>${r}</b><div class="text-sm">${r2}</div></div></div>`;
  let h=`<div class="glass rounded-3xl p-5 shadow-sm mb-3"><div class="grid grid-cols-3 gap-2 text-sm"><div><div class="text-xs text-gray-400">現值</div><b>${M(st.totalMarketValue||0)}</b></div><div><div class="text-xs text-gray-400">未實現</div><b>${pl(un)}</b></div><div><div class="text-xs text-gray-400">已實現（累計）</div><b>${pl(real)}</b></div></div><div class="text-xs text-gray-500 mt-3">股利收入 ${pl(dv)}・含已賣出與股利的合計損益 ${pl(un+real+dv)}</div></div>
   <div class="flex gap-2 mb-3">${pill('inv','庫存')}${pill('sold','已賣出')}${pill('log','交易')}</div><div class="glass rounded-3xl p-2 shadow-sm">`;
  if(SV==='inv') h+=st.holdings.slice().sort((a,b)=>b.marketValue-a.marketValue).map(s=>{const r=s.cost>0?(s.profitLoss/s.cost*100).toFixed(1):'0.0';
    return row(s.name,`${s.ticker}・${s.shares} 股・均價 ${(s.cost/s.shares).toFixed(2)}${s.broker?'・'+s.broker:''}`,M(s.marketValue),`${pl(s.profitLoss)}（${s.profitLoss>=0?'+':''}${r}%）`,`onclick="openTrade('sell',${s.row})"`);}).join('')+'<div class="text-xs text-gray-400 text-center py-2">點一檔可記錄賣出</div>';
  if(SV==='sold') h+=(sells.map(x=>row(x.name,`${x.d}・${x.shares} 股 @ ${x.price}`,M(Math.round(x.price*x.shares)),pl(x.pl))).join('')+lg.map(x=>row(x.name,`舊紀錄・${x.shares} 股`,M(Math.round(x.price*x.shares)),pl(x.pl))).join(''))||'<div class="text-sm text-gray-500 text-center py-6">還沒有賣出紀錄</div>';
  if(SV==='log') h+=(tr.length?`<button onclick="undoTrade()" class="w-full text-xs text-amber-700 py-2">↩︎ 撤銷最新一筆（${tr[0].name}）</button>`:'')+(tr.slice(0,40).map(x=>x.act==='息'?row('股利 '+x.name,`${x.d}${x.shares>0?'・配股 '+x.shares+' 股':''}`,M(x.pl),'現金股利'):row(`${x.act==='買'?'買進':'賣出'} ${x.name}`,`${x.d}・${x.shares} 股 @ ${x.price}${x.broker?'・'+x.broker:''}`,M(Math.round(x.price*x.shares)),`手續費 ${fm(x.fee)}${x.tax?'・稅 '+fm(x.tax):''}`)).join('')||'<div class="text-sm text-gray-500 text-center py-6">還沒有交易紀錄</div>');
  box.innerHTML=h+'</div>';
}
function allocCard(){
  const c=D.cashData, st=D.stockData, hs=st?st.holdings:[];
  const bond=hs.filter(x=>/^00\d+B$/.test(x.ticker)).reduce((a,x)=>a+x.marketValue,0), stock=(st?st.totalMarketValue:0)-bond, cash=c.totalCash, tot=cash+stock+bond;
  if(!(tot>0)) return '';
  const it=[['現金',cash,'#b9805e'],['股票／ETF',stock,'#8b5a42'],['債券ETF',bond,'#dcb8a3']].filter(x=>x[1]>0);
  return `<section><h3 class="text-lg font-bold text-milktea-800 mb-3 pl-2">資產配置</h3><div class="glass rounded-3xl p-5 shadow-sm"><div class="flex h-3 rounded-full overflow-hidden mb-3">${it.map(x=>`<div style="width:${x[1]/tot*100}%;background:${x[2]}"></div>`).join('')}</div>${it.map(x=>`<div class="flex justify-between text-sm py-0.5"><span><i class="inline-block w-2.5 h-2.5 rounded-full mr-2" style="background:${x[2]}"></i>${x[0]}</span><span><b>${M(x[1])}</b> <span class="text-xs text-gray-400">${(x[1]/tot*100).toFixed(0)}%</span></span></div>`).join('')}</div></section>`;
}
function healthCard(){
  const cf=D.config||{}, c=D.cashData, st=D.stockData, assets=c.totalCash+(st?st.totalMarketValue:0), debt=c.totalCreditCardDebt+D.debtData.totalRemaining, rows=[];
  if(cf.expense>0) rows.push(['緊急預備金可支撐',(c.availableCash/cf.expense).toFixed(1)+' 個月']);
  if(assets>0) rows.push(['負債占總資產',(debt/assets*100).toFixed(0)+'%']);
  if(!rows.length) return '';
  return `<section><h3 class="text-lg font-bold text-milktea-800 mb-3 pl-2">財務健康</h3><div class="glass rounded-3xl p-5 shadow-sm space-y-2">${rows.map(r=>`<div class="flex justify-between text-sm"><span class="text-gray-500">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div></section>`;
}
function curHold(){ const hs=D.stockData.holdings, e=$('t_row'); if(TR!=='buy'&&e) return hs.find(x=>x.row===+e.value); const n=$('t_nm'); return n?hs.find(x=>x.name===n.value):null; }
function openTrade(act,row){
  TR=act; const hs=D.stockData.holdings, sel=row||(hs[0]&&hs[0].row), today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const f=(id,l,x='',ty='text')=>`<label class="block text-sm font-bold">${l}<input id="${id}" type="${ty}" ${x} oninput="tcalc(this)" class="inp !text-left mt-1"></label>`;
  const tg=`<div class="flex gap-2">${[['buy','買進'],['sell','賣出'],['div','股利']].map(([k,t])=>`<button type="button" onclick="openTrade('${k}'${k!=='buy'&&sel?','+sel:''})" class="flex-1 py-2 rounded-xl font-bold ${TR===k?'bg-milktea-800 text-white':'bg-white/60'}">${t}</button>`).join('')}</div>`;
  const pick=act!=='buy'?`<select id="t_row" onchange="tcalc(this)" class="inp !text-left">${hs.map(x=>`<option value="${x.row}" ${x.row===sel?'selected':''}>${x.name}（${x.shares} 股${x.broker?'・'+x.broker:''}）</option>`).join('')}</select>`
    :f('t_nm','股票名稱','list="tl"')+`<datalist id="tl">${hs.map(x=>`<option value="${x.name}">`).join('')}</datalist>`+f('t_tk','股票代號');
  const dt=f('t_dt','日期',`value="${today}"`,'date'), nt=f('t_nt','備註');
  const body=act==='div'?f('t_cash','現金股利總額（實收）','inputmode="decimal"')+f('t_sh','配股股數（沒有就留空）','inputmode="numeric"')+dt+nt
    :f('t_sh','股數','inputmode="numeric"')+f('t_px','成交價','inputmode="decimal"')+dt+f('t_br','券商')+f('t_fee','手續費（自動，可改）','inputmode="numeric"')+f('t_tax','證交稅（自動，可改）','inputmode="numeric"')+nt;
  $('tform').innerHTML=tg+pick+body; $('tprev').innerHTML=''; $('tmodal').classList.remove('hidden'); document.body.classList.add('mo'); if(act!=='buy') tcalc($('t_row'));
}
function tcalc(el){
  if(el&&(el.id==='t_fee'||el.id==='t_tax')) el.dataset.man='1';
  const h=curHold();
  if(el&&(el.id==='t_row'||el.id==='t_nm')&&h){ if($('t_br')) $('t_br').value=h.broker||''; if($('t_tk')) $('t_tk').value=h.ticker; }
  if(TR==='div'){ $('tprev').innerHTML=''; return; }
  const n=+$('t_sh').value||0, amt=n*(+$('t_px').value||0), tk=String(h?h.ticker:($('t_tk')?$('t_tk').value:'')), disc=(h&&h.feeDiscount)||(D.config&&D.config.feeDiscount)||1;
  if(!$('t_fee').dataset.man) $('t_fee').value=amt?Math.max(20,Math.floor(amt*0.001425*disc)):'';
  if(!$('t_tax').dataset.man) $('t_tax').value=TR==='sell'&&amt?Math.floor(amt*taxRate(tk)):0;
  const fee=+$('t_fee').value||0, tax=+$('t_tax').value||0;
  if(TR==='sell'&&h&&n&&amt){ const p=Math.round(amt)-fee-tax-Math.round(h.cost*n/h.shares); $('tprev').innerHTML=`預估入帳 ${fm(Math.round(amt)-fee-tax)}　已實現 <span class="${p>=0?'text-red-500':'text-green-600'}">${p>=0?'+':'−'}${fm(Math.abs(p))}</span>`; }
  else $('tprev').innerHTML=TR==='buy'&&amt?`含手續費總成本 ${fm(Math.round(amt)+fee)}`:'';
}
async function post(body,okMsg,failMsg){
  try{ const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-pass':tok()},body:JSON.stringify(body)});
    const j=await r.json(); if(j.status!=='success') throw new Error(j.message);
    toast(okMsg); await load(); return true;
  }catch(e){ toast(failMsg+e.message); return false; }
}
async function undoTrade(){ if(confirm('撤銷最新一筆交易，庫存會一併還原。確定嗎？')) await post({action:'undo_trade'},'已撤銷','撤銷失敗：'); }
async function saveTrade(){
  const h=curHold(), v=id=>$(id)?$(id).value:'', n=+v('t_sh')||0, p=+v('t_px')||0;
  const d={type:TR,date:v('t_dt'),broker:v('t_br'),shares:n,price:p,fee:+v('t_fee')||0,tax:+v('t_tax')||0,note:v('t_nt'),cash:+v('t_cash')||0};
  if(TR!=='buy'){ if(!h) return toast('請選擇股票'); Object.assign(d,{row:h.row,ticker:h.ticker,name:h.name,broker:h.broker||d.broker}); }
  else { d.name=v('t_nm').trim(); d.ticker=v('t_tk').trim(); if(!d.name||!d.ticker) return toast('請填股票名稱與代號'); }
  if(TR==='sell'&&n>h.shares) return toast('超過持有股數');
  if(TR!=='div'&&(!(n>0)||!(p>0))) return toast('請填股數與成交價');
  if(TR==='div'&&!(d.cash>0)&&!(n>0)) return toast('請填現金股利或配股股數');
  const b=$('tbtn'); b.disabled=true;
  if(await post({action:'trade',data:d},'✅ 已記錄','失敗：')) closeTrade();
  b.disabled=false;
}
function sellNet(s){ const f=0.001425*(s.feeDiscount||(D.config&&D.config.feeDiscount)||1), t=taxRate(s.ticker); return Math.round(s.marketValue*(1-f-t)); }
async function undo(){
  if(!confirm('確定還原到上一次儲存之前的數字？')) return;
  try{ const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-pass':tok()},body:JSON.stringify({action:'undo'})});
    const j=await r.json(); if(j.status!=='success') throw new Error(j.message);
    closeModal(); toast('已還原'); await load();
  }catch(e){ toast('還原失敗：'+e.message); }
}
function payoff(hs,rem){
  const a=hs.filter(x=>x.debt!=null); if(rem<=0||a.length<2) return '';
  const f=a[0],l=a[a.length-1],mo=(new Date(l.t)-new Date(f.t))/2.63e9,pace=(f.debt-l.debt)/mo;
  if(!(mo>0.5)||!(pace>0)) return '';
  const d=new Date(Date.now()+rem/pace*2.63e9);
  return `<div class="text-xs text-gray-500 text-center pt-1">依近期還款速度（每月約 ${fm(pace)}），預計 ${d.getFullYear()}/${d.getMonth()+1} 還清</div>`;
}
function simCalc(){
  const c=D.cashData; let sell=0,pay=0;
  document.querySelectorAll('.sim-s:checked').forEach(e=>sell+=+e.dataset.v);
  document.querySelectorAll('.sim-d').forEach(e=>pay+=Math.min(Number(e.value)||0,+e.dataset.max));
  const na=c.availableCash+sell-pay, dt=na-D.targetData.currentTarget;
  $('simout').innerHTML=`可動用現金 ${fm(c.availableCash)} → <span class="text-milktea-800">${fm(na)}</span><br>${D.targetData.currentTarget>0?'與月底目標'+(dt>=0?'超前':'落後')+' '+fm(Math.abs(dt))+'　':''}剩餘借款 ${fm(D.debtData.totalRemaining-pay)}`;
}
function spark(hs){
  const W=320,H=100,P=8,vs=hs.map(x=>x.net),lo=Math.min(...vs),hi=Math.max(...vs);
  const X=i=>P+i*(W-2*P)/(hs.length-1),Y=v=>H-P-(v-lo)/(hi-lo||1)*(H-2*P);
  const d=hs.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.net).toFixed(1)).join('');
  const f=t=>new Date(t).toLocaleDateString('zh-TW',{year:'2-digit',month:'numeric',day:'numeric'}), ch=hs[hs.length-1].net-hs[0].net;
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full"><path d="${d}" fill="none" stroke="#8b5a42" stroke-width="2.5"/>${hs.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.net)}" r="3" fill="#8b5a42"/>`).join('')}</svg><div class="flex justify-between text-xs text-gray-500 mt-1"><span>${f(hs[0].t)}</span><span>期間變化 ${ch>=0?'+':'−'}${fm(Math.abs(ch))}</span><span>${f(hs[hs.length-1].t)}</span></div>`;
}
function render(){
  const c=D.cashData, st=D.stockData, db=D.debtData, tg=D.targetData;
  const avail=c.availableCash, target=tg.currentTarget, delta=avail-target, ahead=delta>=0, hasT=target>0;
  const pct=Math.max(0,Math.min(avail/target*100,100)).toFixed(1);
  const net=c.totalCash+(st?st.totalMarketValue:0)-c.totalCreditCardDebt-db.totalRemaining;

  let h=`<section class="glass rounded-3xl p-6 shadow-sm">
    <h2 class="text-sm font-semibold text-gray-500">實際可動用現金（已扣卡費${c.mortgagePending?'與預扣房貸 '+M(c.mortgage):'・本月房貸已扣款'}）</h2>
    <div class="text-4xl font-extrabold tracking-tight mt-1">${M(avail)}</div>
    ${hasT?`<div class="mt-2 inline-block text-sm font-bold px-3 py-1 rounded-full ${ahead?'bg-green-100 text-green-700':'bg-amber-100 text-amber-800'}">${ahead?'已超過':'距離'}本月底目標 ${M(Math.abs(delta))}${ahead?'':'（尚差）'}</div>
    <div class="w-full bg-white/60 rounded-full h-2.5 mt-4 overflow-hidden"><div class="bar ${ahead?'bg-green-400':'bg-amber-400'} h-2.5 rounded-full" id="pb" style="width:0%"></div></div>
    <div class="text-xs text-gray-400 mt-1">本月底目標 ${M(target)}・達成 ${(avail/target*100).toFixed(0)}%</div>`:''}
    <div class="mt-4 pt-4 border-t border-white/60 grid grid-cols-3 gap-2 text-sm">
      <div><div class="text-gray-400 text-xs">銀行總額</div><b>${M(c.totalCash)}</b></div>
      <div><div class="text-gray-400 text-xs">未出帳卡費</div><b class="text-amber-700">${M(c.totalCreditCardDebt)}</b></div>
      <div><div class="text-gray-400 text-xs">淨資產</div><b>${M(net)}</b></div>
    </div></section>`;

  h+=flowCard();
  h+=allocCard()+healthCard();
  const hist=D.history||[];
  if(hist.length){ const days=Math.floor((Date.now()-new Date(hist[hist.length-1].t))/864e5);
    if(days>((D.config&&D.config.staleDays)||35)) h=`<div class="rounded-2xl bg-amber-100 text-amber-800 text-sm font-bold px-4 py-3">⚠️ 已 ${days} 天沒有更新，數字可能已過期</div>`+h; }
  if(hist.length>1) h+=`<section><h3 class="text-lg font-bold text-milktea-800 mb-3 pl-2">淨資產走勢</h3><div class="glass rounded-3xl p-5 shadow-sm">${spark(hist)}</div></section>`;
  if(tg.series&&tg.series.length>1) h+=`<section><h3 class="text-lg font-bold text-milktea-800 mb-3 pl-2">計畫 vs 實際</h3><div class="glass rounded-3xl p-5 shadow-sm"><div id="chartbar" class="flex gap-2 mb-3 flex-wrap"></div><div id="chartbox"></div></div></section>`;

  if(D.goals&&D.goals.length) h+=`<section><h3 class="text-lg font-bold text-milktea-800 mb-3 pl-2">長期里程碑（以淨資產計）</h3><div class="glass rounded-3xl p-5 shadow-sm space-y-4">`+D.goals.map(g=>{
    const p=Math.max(0,Math.min(net/g.target*100,100)), left=g.date?Math.ceil((new Date(g.date)-Date.now())/864e5):null;
    return `<div><div class="flex justify-between text-sm mb-1.5"><b>${g.name}</b><span class="text-xs text-gray-500">${p.toFixed(0)}%・尚缺 ${M(Math.max(g.target-net,0))}${left!=null?'・'+(left>0?left+' 天後':'已到期'):''}</span></div><div class="w-full bg-white/60 rounded-full h-2.5 overflow-hidden"><div class="bar bg-milktea-800 h-2.5 rounded-full" style="width:${p}%"></div></div></div>`;}).join('')+'</div></section>';
  h+=`<section><div class="flex justify-between items-end mb-3 pl-2"><h3 class="text-lg font-bold text-milktea-800">親友借款進度</h3><span class="text-sm font-bold text-amber-700">剩餘待還 ${M(db.totalRemaining)}</span></div>
    <div class="glass rounded-3xl p-6 shadow-sm space-y-5">`;
  h+= db.debts.length ? db.debts.map(d=>`<div><div class="flex justify-between items-end mb-1.5"><b class="text-gray-700">${d.name}</b><span class="text-xs text-gray-500">已還 ${d.progress}%・剩 ${M(d.remaining)}</span></div>
    <div class="w-full bg-white/60 rounded-full h-2.5 overflow-hidden"><div class="bar db bg-milktea-800 h-2.5 rounded-full" data-w="${d.progress}" style="width:0%"></div></div></div>`).join('') : '<div class="text-center text-gray-500">🎉 借款已全數還清</div>';
  h+=payoff(D.history||[],db.totalRemaining)+'</div></section>';

  if(st) h+=`<section><h3 class="text-lg font-bold text-milktea-800 mb-3 pl-2">股票存摺</h3><div id="stkbox"></div></section>`;

  h+=`<section><div class="flex justify-between items-end mb-3 pl-2"><h3 class="text-lg font-bold text-milktea-800">各帳戶餘額明細</h3><span class="text-sm text-gray-500">合計 ${M(c.totalCash)}</span></div><div class="glass rounded-3xl p-4 shadow-sm">${accHTML(c)}</div></section>`;

  h+=`<section><h3 class="text-lg font-bold text-milktea-800 mb-3 pl-2">情境模擬</h3><div class="glass rounded-3xl p-5 shadow-sm space-y-3" id="sim">
    ${st?st.holdings.map(s=>`<label class="flex justify-between items-center text-sm"><span><input type="checkbox" class="sim-s mr-2" data-v="${sellNet(s)}">賣出 ${s.name}${s.broker?'<span class="text-xs text-gray-400">（'+s.broker+'）</span>':''}</span><span class="text-right"><b>${M(sellNet(s))}</b><div class="text-xs text-gray-400">已扣手續費與證交稅</div></span></label>`).join(''):''}
    ${db.debts.map(d=>`<label class="flex justify-between items-center text-sm gap-3"><span class="shrink-0">提前還 ${d.name}</span><input inputmode="decimal" placeholder="0" class="inp sim-d" style="max-width:8rem" data-max="${d.remaining}"></label>`).join('')}
    <div id="simout" class="text-sm font-bold pt-3 border-t border-white/60"></div></div></section>`;
  h+=`<div class="text-center text-xs text-gray-400 pt-4">網頁 ${VER}・${D.version||'後端舊版'}</div>`;
  $('app').innerHTML=h; drawChart(); drawStock(); route(); $('sim').oninput=simCalc; simCalc(); 
  setTimeout(()=>{ if($('pb'))$('pb').style.width=pct+'%'; document.querySelectorAll('.db').forEach(e=>e.style.width=e.dataset.w+'%'); },80);
}

// ===== 更新視窗 =====
function openModal(){
  if(!D) return;
  const c=D.cashData, row=(l,k,i,v,x='')=>`<div class="grid grid-cols-2 gap-2 items-center bg-white/60 p-2 rounded-xl"><label class="text-sm font-bold truncate">${l}</label><input type="text" inputmode="decimal" data-k="${k}" data-i="${i}" data-o="${v}" value="${v}" class="inp ${x}"></div>`;
  let h='<h3 class="font-bold text-milktea-800">🏦 銀行餘額　／　💳 未出帳卡費</h3><div class="grid grid-cols-3 gap-2 text-xs text-gray-400 px-2"><span></span><span class="text-right">餘額</span><span class="text-right">卡費</span></div>';
  h+=c.accounts.map((a,i)=>`<div class="grid grid-cols-3 gap-2 items-center bg-white/60 p-2 rounded-xl"><label class="text-sm font-bold truncate">${a.name}</label>
    <input inputmode="decimal" data-k="a" data-i="${i}" data-o="${a.balance}" value="${a.balance}" class="inp"><input inputmode="decimal" data-k="c" data-i="${i}" data-o="${a.ccBill}" value="${a.ccBill}" class="inp text-amber-700"></div>`).join('');
  if(D.debtData.debts.length) h+='<h3 class="font-bold text-milktea-800 pt-3">🤝 親友借款（累計已還，輸入正數）</h3>'+D.debtData.debts.map((d,i)=>row(d.name,'d',i,d.repaid)).join('');
  if(D.stockData&&D.stockData.holdings.length) h+='<h3 class="font-bold text-milktea-800 pt-3">📈 股票持股數</h3>'+D.stockData.holdings.map((s,i)=>row(s.name,'s',i,s.shares)).join('');
  $('form').innerHTML=(D.undoAt?`<button type="button" onclick="undo()" class="text-xs text-amber-700 underline">↩︎ 還原上一次儲存（${hhmm(D.undoAt)}）</button>`:'')+h; $('form').oninput=onEdit; onEdit();
  $('modal').classList.remove('hidden'); document.body.classList.add('mo');
}
function closeModal(){ $('modal').classList.add('hidden'); document.body.classList.remove('mo'); }
function onEdit(){
  let a=0,c=0;
  document.querySelectorAll('#form input').forEach(el=>{
    const v=Number(el.value)||0; el.classList.toggle('chg',v!==Number(el.dataset.o));
    if(el.dataset.k==='a') a+=v; if(el.dataset.k==='c') c+=v; });
  const mAfter=new Date().getDate()>=Math.min(((D.config&&D.config.mortgageDay)||3),new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate())?0:D.cashData.mortgage, n=a-c-mAfter, d=n-D.cashData.availableCash;
  $('preview').innerHTML=`更新後可動用現金：${fm(n)}　<span class="${d>=0?'text-green-600':'text-amber-700'}">${d>=0?'+':'−'}${fm(Math.abs(d))}</span>`;
}
async function save(ev){
  ev.preventDefault();
  const U={accounts:{},creditCards:{},debts:{},stocks:{}}, btn=$('sbtn'); btn.disabled=true; btn.textContent='儲存中…';
  document.querySelectorAll('#form input').forEach(el=>{
    const i=+el.dataset.i, v=Number(el.value)||0, k=el.dataset.k;
    if(k==='a') U.accounts[D.cashData.accounts[i].row]=v;
    else if(k==='c') U.creditCards[D.cashData.accounts[i].row]=v;
    else if(k==='d') U.debts[D.debtData.debts[i].row]=v;
    else if(k==='s') U.stocks[D.stockData.holdings[i].row]=v; });
  const odd=[]; document.querySelectorAll('#form input[data-k="a"]').forEach(el=>{const o=Number(el.dataset.o),v=Number(el.value)||0; if(o>0&&Math.abs(v-o)>10000&&Math.abs(v-o)/o>((D.config&&D.config.alertPct)||50)/100) odd.push(D.cashData.accounts[+el.dataset.i].name+'：'+fm(o)+' → '+fm(v));});
  if(odd.length&&!confirm('以下帳戶變動超過門檻，確定嗎？\n'+odd.join('\n'))){ btn.disabled=false; btn.textContent='儲存同步'; return; }
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-pass':tok()},body:JSON.stringify({action:'update_all',data:U})});
    const j=await r.json(); if(j.status!=='success') throw new Error(j.message);
    closeModal(); toast('✅ 已儲存並建立歷史快照'); setStatus('更新資料中…'); await load();
  }catch(e){ toast('儲存失敗：'+e.message); }
  finally{ btn.disabled=false; btn.textContent='儲存同步'; }
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
window.onload=()=>{renderBar();load();};
</script>
